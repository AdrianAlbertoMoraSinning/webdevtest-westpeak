<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrar agenda | AP Abogados Asociados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="agenda.css" />
</head>
<body class="agenda-page">
  <header class="agenda-header">
    <a class="agenda-back" href="../../index.html">← Volver al inicio</a>
    <div>
      <p class="eyebrow">Panel privado</p>
      <h1>Administrar reservas</h1>
      <p>Consulta, cancela o edita registros de la agenda.</p>
    </div>
  </header>

  <main class="agenda-shell admin-shell">
    <section class="agenda-card" id="loginCard">
      <h2>Acceso administrador</h2>
      <form id="adminLogin" class="booking-form">
        <label>
          PIN privado
          <input id="adminPin" type="password" required placeholder="PIN" />
        </label>
        <button class="btn primary" type="submit">Entrar</button>
        <p id="adminLoginMessage" class="booking-message"></p>
      </form>
    </section>

    <section class="agenda-card admin-panel hidden" id="adminPanel">
      <div class="agenda-toolbar">
        <h2>Reservas registradas</h2>
        <button class="agenda-nav" id="refreshBookings" type="button">Actualizar</button>
      </div>
      <div id="adminBookings" class="admin-bookings"></div>
    </section>
  </main>

  <script src="agenda-config.js"></script>
  <script src="agenda-admin.js"></script>
</body>
</html>
